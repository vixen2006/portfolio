<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VIXXEN — Vaishnavi Trivedi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#dcc8bd;--bg2:#c6b0a4;--ink:#2b211f;--mut:#65544f;--wire:#f8f2ea;--glow:#ff9d2e;--shade:84,58,52;--line:rgba(84,58,52,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2120;--bg2:#1d1615;--ink:#f5ece4;--mut:#bba9a2;--wire:#ebe0d5;--shade:0,0,0;--line:rgba(255,235,225,.2)}}
:root[data-theme="dark"]{--bg1:#2b2120;--bg2:#1d1615;--ink:#f5ece4;--mut:#bba9a2;--wire:#ebe0d5;--shade:0,0,0;--line:rgba(255,235,225,.2)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg1);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.vig,.grain{position:fixed;inset:0;pointer-events:none;z-index:6}
.vig{background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(50,28,22,.2))}
.grain{opacity:.08;mix-blend-mode:multiply;animation:g .8s steps(4) infinite}
@keyframes g{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.bar{position:fixed;left:0;right:0;height:10vh;background:#000;z-index:9;transition:transform 1.6s cubic-bezier(.7,0,.2,1) 1.6s}
.bar.t{top:0}.bar.b{bottom:0}
body.go .t{transform:translateY(-100%)}body.go .b{transform:translateY(100%)}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 4vw 0;font:500 12px/1 "JetBrains Mono",monospace;letter-spacing:.18em}
.top span{display:flex;align-items:center;gap:22px}.top i{font-style:normal;color:var(--mut)}
.pill{color:var(--ink);text-decoration:none;border:1px solid var(--ink);border-radius:99px;padding:10px 16px}
main{position:relative;z-index:2}
.hero{height:120vh;position:relative}
.hero .c{position:absolute;top:82vh;left:0;right:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.hero p{margin:0;font-size:clamp(17px,1.7vw,24px);font-weight:500}
.mono,#intro small,.lab,.stats span,.t,.lk,.row .d{font-family:"JetBrains Mono",monospace}
.dot{border:1px solid var(--line);border-radius:99px;padding:9px 16px;font:500 12px "JetBrains Mono",monospace;letter-spacing:.14em}
.dot:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#35b36b;margin-right:10px}
#intro small{font-size:11px;letter-spacing:.2em;color:var(--mut)}
.s{padding:12vh 8vw 8vh 6vw;max-width:1180px}
.lab{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:0 0 1.6rem}
h2{font-size:clamp(40px,6.4vw,96px);font-weight:400;letter-spacing:-.03em;line-height:1;margin:0 0 .5em}
.lead{font-size:clamp(17px,1.5vw,22px);line-height:1.55;color:var(--mut);max-width:58ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:2rem clamp(24px,4vw,56px);margin-top:3rem}
.stats b{display:block;font-weight:400;font-size:clamp(32px,3.4vw,48px);line-height:1;margin-bottom:.6rem}
.stats span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.row{display:grid;grid-template-columns:clamp(54px,9vw,150px) 1fr;border-top:1px solid var(--line);padding:2rem 0}
.row .d{font-size:12px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;padding-top:.7rem}
.row h3{margin:0;font-weight:500;font-size:clamp(26px,3vw,44px);letter-spacing:-.02em;line-height:1.1}
.row em{display:block;font-style:normal;color:var(--mut);margin:.4rem 0 1rem}
.row p{margin:0 0 .9rem;line-height:1.55;max-width:62ch;font-size:clamp(15px,1.2vw,18px)}
.t{display:inline-block;font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;margin:0 8px 8px 0}
.lk{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-right:1.2rem;text-underline-offset:5px}
.row.win{padding:1.5rem 0}.row.win h3{font-size:clamp(20px,2vw,28px)}.row.win em{margin:.3rem 0 0}
#connect{min-height:100vh}
#fig{position:fixed;left:0;right:0;bottom:0;height:22vh;display:flex;justify-content:center;align-items:flex-end;gap:min(2.4vw,26px);z-index:3;pointer-events:none;opacity:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.fig{--u:min(1.9vh,2.8vw);position:relative;width:calc(var(--u)*7*var(--k));display:flex;flex-direction:column;align-items:center;animation:bob 3.2s ease-in-out infinite}
.fig .h{width:calc(var(--u)*6*var(--k));height:calc(var(--u)*6*var(--k));border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.7*var(--k))}
.fig .b{width:calc(var(--u)*7*var(--k));height:calc(var(--u)*5*var(--k));margin-top:calc(var(--u)*-.6*var(--k));border-radius:50% 50% 12% 12%/70% 70% 12% 12%;background:var(--c);filter:brightness(.94)}
.e{width:calc(var(--u)*2.3*var(--k));height:calc(var(--u)*2.3*var(--k));border-radius:50%;background:#fffaf4;display:flex;align-items:center;justify-content:center}
.e i{width:46%;height:46%;border-radius:50%;background:#2b211f;display:block;transition:transform .08s linear}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-.5))}}
@media(max-width:700px){.s{padding-right:12vw}.row{grid-template-columns:1fr}.row .d{padding:0 0 .6rem}.top i{display:none}}
@media(prefers-reduced-motion:reduce){.grain,.fig{animation:none}.bar{transition:none}}
#intro{position:fixed;left:0;right:0;bottom:calc(6vh + env(safe-area-inset-bottom,0px));z-index:4;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
#intro p{margin:0;font-size:clamp(17px,1.7vw,24px);font-weight:500}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s ease}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none}}
</style>
</head>

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>{x=clamp(x);return x*x*(3-2*x)},eo=x=>1-Math.pow(1-clamp(x),3),ei=x=>{x=clamp(x);return x*x};
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const BR=[[210,188,172],[184,157,143],[43,33,31]];
const PAL=[BR,[[122,92,96],[84,60,68],[250,240,232]],[[24,19,32],[10,8,16],[245,238,232]],[[14,36,38],[6,18,20],[238,248,244]],[[34,46,62],[18,24,34],[238,244,250]],[[32,66,46],[16,36,26],[246,248,228]],BR];
const HUE=[18,340,300,150,190,60],WORDS=["About","Projects","Experience","Skills","Wins"],LAB=["01 / About","02 / The baseline","03 / The match","04 / The roster","05 / Match point"];
let W,H,dpr,cut,P=[],Zs=[],WT=[],cA,cB,sA,sB,t0=performance.now();

/* figurines */
const fg=$("#fig"),pup=[],C=["#f8f2ea","#e6c7bf","#d2b8a8","#f5a04a","#d9b8ad","#b9a496","#fbe0c0"],K=[1,1.35,.9,1.2,1.05,1.3,.85];
for(let i=0;i<(innerWidth<700?5:7);i++){const f=document.createElement("div");f.className="fig";f.style.cssText=`--c:${C[i]};--k:${K[i]};animation-delay:${-i*.45}s`;f.innerHTML='<div class="h"><div class="e"><i></i></div><div class="e"><i></i></div></div><div class="b"></div>';fg.appendChild(f)}
fg.querySelectorAll(".e").forEach(e=>pup.push({e,i:e.firstChild}));
let mx=innerWidth/2,my=innerHeight/2;
function eyes(){pup.forEach(p=>{const r=p.e.getBoundingClientRect();p.x=r.left+r.width/2;p.y=r.top+r.height/2;p.r=r.width*.27})}
function look(){pup.forEach(p=>{const dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy)||1,m=Math.min(p.r,d/14);p.i.style.transform=`translate(${dx/d*m}px,${dy/d*m}px)`})}
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;look()});

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".s>.lab,.s>h2,.s>.lead,.s>.stats,.s>p,.row").forEach(e=>{e.classList.add("rv");io.observe(e)});

/* layout: particle targets for face, bursts, pile and words */
function build(){
  if(!P.length||!W)return;
  const mob=W<700;sA=Math.min(H*.8,W*.92)/640;sB=(mob?Math.min(H*.34,W*.7):Math.min(H*.56,W*.42))/640;cA=[W*.5,H*.5];cB=mob?[W*.5,H*.66]:[W*.74,H*.52];
  for(const p of P){p.ax=cA[0]+p.lx*sA;p.ay=cA[1]+p.ly*sA;p.sx=cA[0]+p.lx*sA*1.08;p.sy=cA[1]+p.ly*sA*1.08;p.qx=cB[0]+p.lx*sB;p.qy=cB[1]+p.ly*sB;
    const a=Math.atan2(p.ly,p.lx)+(p.d-.5)*.9,m=(.35+p.m*.9)*H*.9;p.bx=p.sx+Math.cos(a)*m;p.by=p.sy+Math.sin(a)*m-H*.2*p.m;p.px=p.pxr*W;p.py=H*(.94+p.m*.1)}
  const o=document.createElement("canvas"),w=Math.ceil(W/2),h=Math.ceil(H/2);o.width=w;o.height=h;const c=o.getContext("2d");
  WT=WORDS.map(wd=>{c.clearRect(0,0,w,h);const f=n=>`600 ${n}px "Bricolage Grotesque",system-ui,sans-serif`;let fs=Math.min(w*.3,h*.5);c.font=f(fs);const m=c.measureText(wd).width;if(m>w*.86){fs*=w*.86/m;c.font=f(fs)}
    c.textAlign="center";c.textBaseline="middle";c.fillStyle="#000";c.fillText(wd,w/2,h*.46);const a=c.getImageData(0,0,w,h).data,pts=[];
    for(let y=0;y<h;y+=3)for(let x=0;x<w;x+=3)if(a[(y*w+x)*4+3]>128)pts.push(x*2,y*2);return pts})}
function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  Zs=[...document.querySelectorAll(".z")].map(z=>({top:z.offsetTop,h:Math.max(1,z.offsetHeight-H)}));build();eyes()}
addEventListener("resize",size);addEventListener("load",size);size();
if(document.fonts)document.fonts.ready.then(build);

/* face image -> keyed cutout -> particles */
const img=new Image();img.onload=()=>{const o=document.createElement("canvas");o.width=o.height=640;const c=o.getContext("2d");c.drawImage(img,0,0,640,640);const d=c.getImageData(0,0,640,640),a=d.data;
  for(let i=0;i<a.length;i+=4){const r=a[i],g=a[i+1],b=a[i+2],bl=b-Math.max(r,g);if(bl>38)a[i+3]=0;else if(bl>14){a[i+3]=255*(1-(bl-14)/24);a[i+2]=Math.max(r,g)}}
  c.putImageData(d,0,0);cut=o;
  for(let y=0;y<640;y+=6)for(let x=0;x<640;x+=6){const k=(y*640+x)*4;if(a[k+3]>200)P.push({i:P.length,lx:x-320,ly:y-320,fc:`rgb(${a[k]},${a[k+1]},${a[k+2]})`,d:Math.random(),m:Math.random(),pxr:Math.random(),sw:Math.random()-.5,hi:(Math.random()*24)|0,jx:Math.random()-.5,jy:Math.random()-.5})}
  build();t0=performance.now();document.body.classList.add("go")};img.src=FACE;

/* palette follows the scroll: each chapter blends in during its zone */
function pal(y){return PAL[0].map(v=>v.slice());let a=PAL[0].map(v=>v.slice());
  Zs.forEach((z,c)=>{const t=sm((y-z.top-z.h*(c?0:.25))/(z.h*(c?.6:.4)));if(t>0)a=a.map((v,i)=>mix(v,PAL[c+1][i],t))});return a}

/* where one particle is, for zone c at progress u. returns [x,y,alpha,wordness,colourMode] */
function place(p,c,u){
  if(c===0&&u<.56){const r=clamp((u-.05)/.45*1.5-p.d*.5),f=ei(r);
    return[p.ax+p.sw*50*f,p.ay+(p.py-p.ay)*f,1,0,0]}
  const a=c===0?.56:0,b=c===0?.84:c===5?.6:.5,r=sm((u-a)/(b-a)*1.5-p.d*.5);let tx,ty;
  if(c===5){tx=p.qx;ty=p.qy}else{const wt=WT[c],n=(wt&&wt.length/2)||0;if(n){const j=(p.i%n)*2;tx=wt[j]+p.jx*5;ty=wt[j+1]+p.jy*5}else{tx=p.ax;ty=p.ay}}
  let x=p.px+(tx-p.px)*r+Math.sin(r*3.14)*p.sw*80,y=p.py+(ty-p.py)*r,al=1;
  if(c===5)return[x,y,1,1-r,r>.9?0:1];
  const dq=c===0?.88:.72;if(u>dq){const q=clamp((u-dq)/(1-dq));y-=q*q*H*.55*(.3+p.m);al=1-q}
  return[x,y,al,c===0?r:1,c===0?(r>.12?1:0):1]}

function frame(now){
  requestAnimationFrame(frame);
  if(!W||!Zs.length)return;
  const T=(now-t0)/1000,y=scrollY,[c1,c2,ink]=pal(y),dk=ink[0]>150;
  R.setProperty("--ink",`rgb(${ink})`);R.setProperty("--mut",`rgba(${ink},.7)`);R.setProperty("--line",`rgba(${ink},.24)`);
  const g=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.5,Math.max(W,H)*.85);g.addColorStop(0,`rgb(${c1})`);g.addColorStop(1,`rgb(${c2})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  let c=0;for(let i=0;i<Zs.length;i++)if(y>=Zs[i].top)c=i;
  const z=Zs[c],u=clamp((y-z.top)/(1.5*H)),intro=clamp(T/(RM?1.2:4.5)),face=c===0&&u<.05;
  if(cut&&cA){
    ctx.save();
    if(c===0){const gg=sm((u-.14)/.13),amp=0;ctx.translate(Math.sin(T*83)*amp,Math.cos(T*71)*amp)}
    if(face){const fs=Math.min(W*.14,H*.27);ctx.save();ctx.globalAlpha=(1-sm((u-.14)/.13)*.7)*sm(intro*2-.6);ctx.fillStyle=`rgb(${ink})`;ctx.textAlign="center";ctx.font=`500 ${fs}px "Bricolage Grotesque",system-ui,sans-serif`;ctx.restore();
      const gg=sm((u-.14)/.13),s=sA*(1+.08*gg)*(1+.004*Math.sin(T*1.6));ctx.globalAlpha=intro<1?clamp((intro-.9)*10):1;ctx.drawImage(cut,cA[0]-320*s,cA[1]-320*s,640*s,640*s);ctx.globalAlpha=1}
    const ia5=c===5?sm((u-.8)/.18):0;
    if((face&&intro<1)||(!face&&u<.56)){
      const wc=[],sp=c===1?12:5,L=dk?66:46,fsz=(c===5?6*sB:6*sA)*1.08;
      for(let i=0;i<24;i++)wc.push(`hsl(${(HUE[Math.min(c,5)]+i*sp+T*14)%360} 88% ${L}%)`);
      if(dk&&c>0&&c<5)ctx.globalCompositeOperation="lighter";
      for(const p of P){let x,yy,al=1,w=0,k=0;
        if(face){const r=sm(intro*1.5-p.d*.5);x=p.px+(p.ax-p.px)*r;yy=p.py+(p.ay-p.py)*r}else{[x,yy,al,w,k]=place(p,c,u)}
        const sz=fsz+(3.4-fsz)*w;ctx.globalAlpha=al*(1-ia5);ctx.fillStyle=k?wc[p.hi]:p.fc;ctx.fillRect(x-sz/2,yy-sz/2,sz,sz)}
      ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1}
    if(ia5>0){ctx.globalAlpha=ia5;ctx.drawImage(cut,cB[0]-320*sB,cB[1]-320*sB,640*sB,640*sB);ctx.globalAlpha=1}
    ctx.restore();
    if(0){const s=(u-.27)/.15;if(s>0&&s<1){ctx.strokeStyle=`rgba(255,240,220,${1-s})`;ctx.lineWidth=2+8*(1-s);ctx.beginPath();ctx.arc(cA[0],cA[1],eo(s)*H*1.2,0,6.3);ctx.stroke();ctx.fillStyle=`rgba(255,246,236,${.5*(1-sm(s*3))})`;ctx.fillRect(0,0,W,H)}}
    if(0){const a=c===0?sm((u-.76)/.08)*(1-sm((u-.9)/.1)):sm((u-.4)/.1)*(1-sm((u-.78)/.2));
      if(a>.01){ctx.globalAlpha=a;ctx.fillStyle=`rgb(${ink})`;ctx.textAlign="center";ctx.font='500 13px "JetBrains Mono",monospace';if("letterSpacing"in ctx)ctx.letterSpacing="4px";ctx.fillText(LAB[c].toUpperCase(),W*.5,H*.8);if("letterSpacing"in ctx)ctx.letterSpacing="0px";ctx.globalAlpha=1}}
  }
  {const sh=sm((u-.3)/.22),q=sm((u-.58)/.15);
  if(sh>.003){ctx.save();ctx.globalAlpha=sh;ctx.fillStyle="#0b0807";ctx.fillRect(0,0,W,H);
    if(sh>.5){R.setProperty("--ink","#f5ece4");R.setProperty("--mut","rgba(245,236,228,.7)");R.setProperty("--line","rgba(245,236,228,.24)")}
    const px=Math.min(W*.08,H*.15),dy=(1-q)*px*.25;ctx.font=`600 ${px}px "Bricolage Grotesque",system-ui,sans-serif`;ctx.textBaseline="middle";ctx.textAlign="center";
    ctx.globalAlpha=q;ctx.fillStyle="#f5ece4";ctx.fillText("Serving fast systems",W/2,H/2-px*.6+dy);
    const w1=ctx.measureText("with ").width,w2=ctx.measureText("precision.").width,x0=W/2-(w1+w2)/2;ctx.textAlign="left";ctx.fillText("with ",x0,H/2+px*.6+dy);ctx.fillStyle="#ff9d2e";ctx.fillText("precision.",x0+w1,H/2+px*.6+dy);
    ctx.restore()}}
  $("#intro").style.opacity=clamp(1-y/(H*.2))*clamp(intro*2-1);
  const z5=Zs[5],fo=z5?sm((y-(z5.top+z5.h*.8))/(H*.3)):0;fg.style.opacity=fo;fg.style.transform=`translateY(${(1-fo)*40}%)`;if(fo>0&&fo<1)eyes();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
